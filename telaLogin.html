<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fazer Login</title>
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/padraoTelas.css">
</head>
<body>
    <div class="container-login">
        <form id="form-login">
            <div class="input-group">
                <label>CPF</label>
                <input type="text" id="cpfaluno" name="cpfaluno" required placeholder="000.000.000-00">
            </div>
            
            <div class="input-group">
                <label>Senha</label>
                <input type="password" id="senha" name="senha" required placeholder="Digite sua senha">
            </div>

            <div>
                Não possui conta?<br><a href="telaCadastro.html">Cadastre-se</a>
            </div><br>

            <div class="button-group">
                <button type="submit" class="btnLogin">
                    <!--a href="telaFases.html"-->Entrar<!--/a-->
                </button>
            </div>
        </form>
    </div>
    <script src="js/login.js"></script>
</body>
</html>
