<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fazer Cadastro</title>
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/padraoTelas.css">
</head>
<body>
    <div class="container-login">
        <form id="form-cadastro">
            <div class="input-group">
                <label>CPF</label>
                <input type="text" id="cpfaluno" name="cpfaluno" required placeholder="000.000.000-00">
            </div>

            <div class="input-group">
                <label>Nome</label>
                <input type="text" id="nome" name="nome" required placeholder="Escreva seu nome completo">
            </div>

            <div class="input-group">
                <label>Idade</label>
                <input type="number" id="idade" name="idade" required placeholder="00">
            </div>
            
            <div class="input-group">
                <label>Senha</label>
                <input type="password" id="senha" name="senha" required placeholder="Digite sua senha">
            </div>
            <div class="button-group">
                <button type="submit" class="btnLogin" href="telaFases.html">
                    Cadastrar
                </button>
            </div>
        </form>
    </div>
    <script src="js/cadastro.js"></script>
</body>
</html>
